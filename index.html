    <!-- ── Structured Data (JSON-LD) ────────────────────────────── -->

    <!-- SoftwareApplication schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BillBlock",
      "url": "https://billblock.app",
      "description": "ระบบออกเอกสารธุรกิจออนไลน์ครบวงจร สำหรับ SME และฟรีแลนซ์ไทย รองรับใบเสนอราคา ใบแจ้งหนี้ ใบเสร็จ VAT WHT P&L และรับชำระผ่าน PromptPay",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "inLanguage": "th",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "THB",
          "description": "ใช้งานฟรีตลอด เอกสาร 5 ฉบับ/เดือน ลูกค้า 5 ราย"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "149",
          "priceCurrency": "THB",
          "description": "เอกสาร 100 ฉบับ/เดือน ลูกค้า 50 ราย รายงาน VAT/WHT/P&L"
        },
        {
          "@type": "Offer",
          "name": "Business",
          "price": "450",
          "priceCurrency": "THB",
          "description": "ไม่จำกัดทุกอย่าง Export Excel ทุกหน้า"
        }
      ]
    }
    </script>

    <!-- Organization schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "logo": "https://billblock.app/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@billblock.app",
        "contactType": "customer support",
        "availableLanguage": "Thai"
      }
    }
    </script>

    <!-- FAQPage schema (AEO — ตรงกับ FAQ section ในหน้าแรก) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "BillBlock ทดลองใช้ฟรีได้นานแค่ไหน?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "แผน Free ไม่มีวันหมดอายุ ใช้ได้ตลอดไปภายในขีดจำกัด (5 เอกสาร/เดือน ลูกค้า 5 ราย สินค้า 5 รายการ)"
          }
        },
        {
          "@type": "Question",
          "name": "ถ้ายกเลิกแผนชำระเงิน ข้อมูล BillBlock จะหายไหม?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ไม่หาย ข้อมูลทุกอย่างยังอยู่ครบ แค่บางฟีเจอร์จะถูกล็อกตามแผน Free"
          }
        },
        {
          "@type": "Question",
          "name": "BillBlock รองรับ e-Tax Invoice ไหม?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ปัจจุบันออกใบกำกับภาษีแบบ PDF ได้ ส่วน e-Tax ผ่านระบบ ETDA อยู่ใน Roadmap"
          }
        },
        {
          "@type": "Question",
          "name": "BillBlock ใช้ได้กี่อุปกรณ์พร้อมกัน?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ไม่จำกัดอุปกรณ์ ใช้ได้ทุก browser บน PC, tablet, มือถือในบัญชีเดียวกัน"
          }
        },
        {
          "@type": "Question",
          "name": "BillBlock ปลอดภัยแค่ไหน?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ระบบใช้ Supabase + Row Level Security ข้อมูลของบัญชีคุณมองเห็นได้เฉพาะคุณเท่านั้น เข้ารหัสด้วย TLS ทุก connection"
          }
        },
        {
          "@type": "Question",
          "name": "BillBlock ราคาเท่าไหร่?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BillBlock มี 3 แผน: Free (ฟรีตลอด), Pro (฿149/เดือน หรือ ฿1,490/ปี), Business (฿450/เดือน หรือ ฿4,500/ปี) ชำระรายปีประหยัดเท่ากับ 2 เดือนฟรี"
          }
        },
        {
          "@type": "Question",
          "name": "BillBlock รองรับหลายบริษัทในบัญชีเดียวได้ไหม?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ปัจจุบัน 1 บัญชี = 1 กิจการ ถ้าต้องการหลายกิจการให้สร้างบัญชีแยกกัน"
          }
        },
        {
          "@type": "Question",
          "name": "BillBlock รองรับ PromptPay ไหม?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "รองรับ สร้าง QR Code PromptPay ในเอกสาร ลูกค้าสแกนชำระ สถานะอัพเดทอัตโนมัติ"
          }
        }
      ]
    }
    </script>
